name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install flux_spec (editable)
        run: pip install -e .
      - name: Install validator dependencies
        run: pip install jsonschema pyyaml rfc8785
      - name: Package data is in sync (flux_spec/data mirrors schema/vendor/vectors)
        run: |
          python scripts/sync-package-data.py
          git diff --exit-code flux_spec/data
      - name: All published and vendored schemas are valid
        run: |
          python - <<'EOF'
          import json, pathlib
          from jsonschema import validators
          for p in (sorted(pathlib.Path("schema").glob("flux-schema-*.json"))
                    + sorted(pathlib.Path("vendor/fluid").glob("*.json"))
                    + sorted(pathlib.Path("vendor/fluid-preview").glob("fluid-schema-*.json"))):
              s = json.loads(p.read_text())
              validators.validator_for(s).check_schema(s)
              print(f"ok  {p}")
          EOF
      - name: latest alias matches current release
        run: cmp schema/flux-schema-0.5.5.json schema/flux-schema-latest.json
      - name: Generated artifacts are in sync (kinds doc + UI hints)
        run: |
          python scripts/generate-kinds-doc.py
          python scripts/generate-ui-hints.py
          git diff --exit-code docs/schema/kinds.md schema/flux-ui-hints-0.5.5.json
      # Placed AFTER the generated-artifact sync check above, so docs/schema/
      # kinds.md is the freshly regenerated one by the time this reads it —
      # and BEFORE the bundle validation below, so a vocabulary failure is not
      # buried under a schema failure. Stdlib only, nothing to install.
      # --self-test first: a corrupt registry must fail loudly rather than
      # quietly bless the tree, and it verifies the vendored payload against
      # its own content digest so a hand-edit fails here, offline.
      - name: Product Guardrail (terminology)
        run: |
          python3 tools/product_guardrail/check.py --self-test
          python3 tools/product_guardrail/check.py

      - name: Validate example bundles (schema + cross-refs + FLUID seam)
        run: python scripts/validate.py
      - name: Enforcement conformance vectors (RFC-04)
        run: python scripts/enforce.py
      - name: Evidence bundle round-trip (RFC-09)
        run: |
          python scripts/bundle.py pack examples/telco-payment-recovery -o dist/
          python scripts/bundle.py verify dist/telco-payment-recovery.flux.tgz
      - name: Regression suite (0.2.0 false-passes must fail)
        run: python tests/test_regression.py
      - name: Release guard accepts the tags it should and refuses the rest
        run: python tests/test_release_guard.py

  package-smoke-test:
    # Proves flux_spec works as a genuinely installed distribution, not just
    # via `pip install -e .` against a checkout: build the wheel, install it
    # into a venv that never sees this repo, and exercise it from outside
    # the repo entirely (cwd=/tmp) so nothing accidentally resolves through
    # a source-tree schema/vendor/tests path instead of the packaged data.
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          pip install build
          python -m build
      - name: Install the built wheel into a clean venv
        run: |
          python -m venv /tmp/flux-spec-wheel-venv
          /tmp/flux-spec-wheel-venv/bin/pip install dist/*.whl
      - name: Run flux_spec from the installed wheel only (repo not on sys.path)
        working-directory: /tmp
        run: |
          /tmp/flux-spec-wheel-venv/bin/python -m flux_spec.enforce
          /tmp/flux-spec-wheel-venv/bin/python -c "from flux_spec.validate import Bundle"
      - name: The wheel ships the pinned FLUID previews and the FLUX schemas in the window
        working-directory: /tmp
        run: |
          /tmp/flux-spec-wheel-venv/bin/python - <<'EOF'
          import json
          from flux_spec._paths import vendor_fluid_preview_dir
          from flux_spec.validate import fluid_schema_file
          # pins.json stays when its last preview is released (VERSIONING.md), so
          # an empty list is a valid state; every pinned preview must ship
          pins = json.loads((vendor_fluid_preview_dir() / "pins.json").read_text())["previews"]
          for pin in pins:
              path = fluid_schema_file(pin["fluidVersion"])
              assert path is not None and path.name == pin["file"], f"FLUID {pin['fluidVersion']} preview is missing"
              print(f"ok  {path}")
          print(f"ok  {len(pins)} pinned FLUID preview(s) in the wheel")
          # every FLUX schema in the window ships too, so verify accepts the packs made under it
          from flux_spec.bundle import SCHEMA_PATH, accepted_schemas
          window = json.loads(SCHEMA_PATH.read_text())["properties"]["fluxVersion"]["enum"]
          assert [v for v, _ in accepted_schemas().values()] == window, f"a FLUX schema in the window {window} is missing"
          print(f"ok  verify accepts packs made under FLUX {', '.join(window)}")
          EOF

  fluid-preview-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-create vendor/fluid-preview from its pins
        run: python3 scripts/sync-fluid-preview.py
      - name: vendor/fluid-preview is exactly what the pins name
        run: |
          git diff --exit-code vendor/fluid-preview
          untracked="$(git ls-files --others --exclude-standard vendor/fluid-preview)"
          if [ -n "$untracked" ]; then
            echo "the sync creates files that are not committed:"
            echo "$untracked"
            exit 1
          fi

  engine-docs-in-sync:
    # docs/engine/ is a generated mirror of the engine's docs, pinned by
    # scripts/engine-docs.ref (see scripts/sync-engine-docs.sh). Same shape as the
    # package-data check in `validate`: re-create the copy and fail on any
    # difference, so a hand edit, or a pin change that forgot to re-run the sync,
    # fails here instead of reaching the site. A job of its own: release.yml
    # requires `validate` to be green on the tagged commit, and a package release
    # should not wait on another repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The site documents an engine people can install, so the pin is a release
      # tag of the engine repository: never a commit, a branch or main.
      - name: The pin names an engine release tag
        run: bash scripts/sync-engine-docs.sh --check-pin
      - name: Re-create docs/engine from the pinned engine docs
        run: bash scripts/sync-engine-docs.sh
      - name: docs/engine is exactly what the pin says
        run: |
          git diff --exit-code docs/engine
          untracked="$(git ls-files --others --exclude-standard docs/engine)"
          if [ -n "$untracked" ]; then
            echo "the sync creates pages that are not committed:"
            echo "$untracked"
            exit 1
          fi
