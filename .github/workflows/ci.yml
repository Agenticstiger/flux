name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install flux_spec (editable)
        run: pip install -e .
      - name: Install validator dependencies
        run: pip install jsonschema pyyaml rfc8785
      - name: Package data is in sync (flux_spec/data mirrors schema/vendor/vectors)
        run: |
          python scripts/sync-package-data.py
          git diff --exit-code flux_spec/data
      - name: All published and vendored schemas are valid
        run: |
          python - <<'EOF'
          import json, pathlib
          from jsonschema import validators
          for p in sorted(pathlib.Path("schema").glob("flux-schema-*.json")) + sorted(pathlib.Path("vendor/fluid").glob("*.json")):
              s = json.loads(p.read_text())
              validators.validator_for(s).check_schema(s)
              print(f"ok  {p}")
          EOF
      - name: latest alias matches current release
        run: cmp schema/flux-schema-0.5.0.json schema/flux-schema-latest.json
      - name: Generated artifacts are in sync (kinds doc + UI hints)
        run: |
          python scripts/generate-kinds-doc.py
          python scripts/generate-ui-hints.py
          git diff --exit-code docs/schema/kinds.md schema/flux-ui-hints-0.5.0.json
      - name: Validate example bundles (schema + cross-refs + FLUID seam)
        run: python scripts/validate.py
      - name: Enforcement conformance vectors (RFC-04)
        run: python scripts/enforce.py
      - name: Evidence bundle round-trip (RFC-09)
        run: |
          python scripts/bundle.py pack examples/telco-payment-recovery -o dist/
          python scripts/bundle.py verify dist/telco-payment-recovery.flux.tgz
      - name: Regression suite (0.2.0 false-passes must fail)
        run: python tests/test_regression.py

  package-smoke-test:
    # Proves flux_spec works as a genuinely installed distribution, not just
    # via `pip install -e .` against a checkout: build the wheel, install it
    # into a venv that never sees this repo, and exercise it from outside
    # the repo entirely (cwd=/tmp) so nothing accidentally resolves through
    # a source-tree schema/vendor/tests path instead of the packaged data.
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          pip install build
          python -m build
      - name: Install the built wheel into a clean venv
        run: |
          python -m venv /tmp/flux-spec-wheel-venv
          /tmp/flux-spec-wheel-venv/bin/pip install dist/*.whl
      - name: Run flux_spec from the installed wheel only (repo not on sys.path)
        working-directory: /tmp
        run: |
          /tmp/flux-spec-wheel-venv/bin/python -m flux_spec.enforce
          /tmp/flux-spec-wheel-venv/bin/python -c "from flux_spec.validate import Bundle"
