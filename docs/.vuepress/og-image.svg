<!--
  Source of public/og-image.png, the share image for link previews.
  Regenerate with: rsvg-convert -w 1200 -h 630 og-image.svg -o public/og-image.png
  (1200x630, the size the Open Graph and Twitter large-card previews expect.)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#f0692e"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="-10%" r="75%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="90%" cy="5%" r="55%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#3b82f6" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#050813"/>
  <rect width="1200" height="630" fill="url(#glowBlue)"/>
  <rect width="1200" height="630" fill="url(#glowViolet)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- The mark, the same path as public/logo-mark.svg, scaled from 64 to 200. -->
  <g transform="translate(230 130) scale(3.125)">
    <path d="M14 8h36l-14 18h14L22 56l8-22H16l6-26z" fill="url(#g)"/>
  </g>

  <text x="470" y="280" fill="#eef2ff" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="176" font-weight="700" letter-spacing="6">FLUX</text>
  <rect x="476" y="318" width="180" height="6" rx="3" fill="url(#rule)"/>

  <text x="600" y="460" text-anchor="middle" fill="#a8b3d4"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="31" font-weight="400">Declare the universe. Prove the rule. Ship the contract that was proven.</text>
</svg>
