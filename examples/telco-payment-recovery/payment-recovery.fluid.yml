# The FLUID contract proven inside the twin — referenced (never restated) by
# sim-payment-recovery's emits seam. What ships is this exact document.
fluidVersion: "0.7.5"
kind: DataProduct
id: telco.gold.payment_recovery_moment
name: Payment Recovery Moment
metadata:
  owner:
    team: growth-lab
exposes:
  - exposeId: payment_recovery_moment
    kind: stream
    contract:
      schema:
        - name: subscriber_id
          type: STRING
          required: true
        - name: aborted_at
          type: TIMESTAMP
          required: true
        - name: amount
          type: "DECIMAL(18,4)"
        - name: market
          type: STRING
    binding:
      platform: kafka
      format: kafka_topic
      location:
        topic: billing.payment-recovery.v1
