fluxVersion: "0.5.0"
kind: JourneyTaxonomy
id: jt-subscriber-lifecycle
name: Subscriber Lifecycle Taxonomy
metadata:
  owner:
    team: growth-lab
spec:
  states: [new, active, atrisk, churned]
  transitions:
    - { from: new, to: active }
    - { from: active, to: atrisk }
    - { from: atrisk, to: active }
    - { from: atrisk, to: churned }
